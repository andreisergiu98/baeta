name: Renovate
on:
  workflow_dispatch:
    inputs:
      cache:
        required: false
        default: enabled
        description: Enable Renovate cache
        type: choice
        options:
          - enabled
          - disabled
      logLevel:
        required: false
        default: info
        description: Log level for Renovate
        type: choice
        options:
          - debug
          - info
jobs:
  Renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          client-id: ${{ secrets.BAETA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BAETA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: baeta
        env:
          LOG_LEVEL: debug
        id: step_1
      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Use Renovate Cache
        if: ${{ github.event.inputs.cache != 'disabled' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-cache-${{ github.run_id }}
          restore-keys: renovate-cache-
      - name: Fix cache permissions
        if: ${{ github.event.inputs.cache != 'disabled' }}
        run: sudo chown -R 12021:0 /tmp/renovate/ || true
      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961
        with:
          token: ${{ steps.step_1.outputs.token }}
          configurationFile: .github/renovate.json
        env:
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.cache }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
          NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: renovate
permissions:
  contents: read
