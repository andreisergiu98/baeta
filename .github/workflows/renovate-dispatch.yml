name: Renovate Dispatch
on:
  schedule:
    - cron: 0 */4 * * *
  push:
    branches:
      - main
    paths:
      - .github/renovate.json
      - .github/workflows/renovate.yml
  issues:
    types:
      - edited
      - closed
  pull_request_target:
    types:
      - edited
      - closed
jobs:
  renovate-dispatch:
    runs-on: ubuntu-latest
    if: ${{ ((github.event_name != 'issues') && (github.event_name !=
      'pull_request_target')) || ((github.event_name == 'issues') &&
      ((github.event.issue.user.login == 'baeta-bot[bot]') &&
      (github.event.sender.login != 'baeta-bot[bot]'))) || ((github.event_name
      == 'pull_request_target') && startsWith(github.head_ref, 'renovate/') &&
      ((github.event.pull_request.user.login == 'baeta-bot[bot]') &&
      (github.event.sender.login != 'baeta-bot[bot]'))) }}
    steps:
      - name: Dispatch Renovate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: >-
            const hour = new Date().getUTCHours();

            const isResetSlot = context.eventName === "schedule" && hour >= 2 &&
            hour < 6;

            const cache = isResetSlot ? "reset" : "enabled";

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "renovate.yml",
              ref: context.payload.repository.default_branch,
              inputs: { cache },
            });
permissions:
  contents: read
  actions: write
