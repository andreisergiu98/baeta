# !!! This file is auto-generated, do not edit by hand !!!
# To make changes, edit .github/workflows-src/renovate.ts and then run:
#
#   github-actions-workflow-builder --directory ".github/workflows-src"

name: Renovate
on:
  workflow_dispatch:
    inputs:
      cache:
        required: false
        default: enabled
        description: Enable Renovate cache
        type: choice
        options:
          - enabled
          - disabled
      logLevel:
        required: false
        default: info
        description: Log level for Renovate
        type: choice
        options:
          - debug
          - info
jobs:
  Renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create Baeta Bot Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.BAETA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BAETA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
        id: step_1
      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"
      - name: Get yarn info
        run: |-
          echo "yarnDir=$(yarn config get globalFolder)" >> $GITHUB_OUTPUT
          echo "yarnVersion=$(yarn --version)" >> $GITHUB_OUTPUT
        shell: bash
        id: step_7
      - name: Setup Renovate Cache
        if: ${{ github.event.inputs.cache != 'disabled' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-cache-${{ github.run_id }}
          restore-keys: renovate-cache-
      - name: Fix-up Renovate cache permissions
        if: ${{ github.event.inputs.cache != 'disabled' }}
        run: sudo chown -R 12021:0 /tmp/renovate/ || true
      - name: Fix-up yarn cache permissions
        run: sudo chown -R 12021:0 ${{ steps.step_7.outputs.yarnDir }}
      - name: Write Renovate Entrypoint
        run: >-
          cat > /tmp/renovate-entrypoint.sh <<'EOF'

          #!/bin/bash

          set -e

          runuser -u ubuntu -- install-tool node 24.14.1

          runuser -u ubuntu -- install-tool yarn ${{
          steps.step_7.outputs.yarnVersion }}

          exec runuser -u ubuntu --preserve-environment renovate

          EOF

          chmod +x /tmp/renovate-entrypoint.sh
        shell: bash
      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961
        with:
          token: ${{ steps.step_1.outputs.token }}
          configurationFile: .github/renovate.json
          docker-user: root
          docker-cmd-file: /tmp/renovate-entrypoint.sh
          docker-volumes: /tmp:/tmp;${{ steps.step_7.outputs.yarnDir
            }}:/home/ubuntu/.yarn/berry
        env:
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.cache }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^yarn install --immutable
            --immutable-cache$","^yarn actions:build$"]'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"YARN_GLOBAL_FOLDER":"/home/ubuntu/.yarn/berry","YARN_ENABLE_GLOBAL_CACHE":"true"}'
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Restore yarn cache permissions
        run: sudo chown -R $(id -u):$(id -g) ${{ steps.step_7.outputs.yarnDir }}
concurrency:
  group: renovate
permissions:
  contents: read
