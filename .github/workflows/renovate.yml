# !!! This file is auto-generated, do not edit by hand !!!
# To make changes, edit .github/workflows-src/renovate.ts and then run:
#
#   github-actions-workflow-builder --directory ".github/workflows-src"

name: Renovate
on:
  workflow_dispatch:
    inputs:
      cache:
        required: false
        default: enabled
        description: Cache mode
        type: choice
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        required: false
        default: info
        description: Log level for Renovate
        type: choice
        options:
          - debug
          - info
jobs:
  Renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create Baeta Bot Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.BAETA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BAETA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
        id: step_1
      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Get Yarn info
        run: echo "version=$(yarn --version)" >> $GITHUB_OUTPUT
        id: step_6
      - name: Get Node.js info
        run: echo "version=$(node --version | sed 's/^v//')" >> $GITHUB_OUTPUT
        id: step_7
      - name: Restore Renovate Cache
        if: ${{ !(github.event.inputs.cache == 'disabled') &&
          !(github.event.inputs.cache == 'reset') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-v2
      - name: Prepare Renovate repository cache dir
        if: ${{ !(github.event.inputs.cache == 'disabled') }}
        run: |-
          rm -rf /tmp/renovate/cache/renovate/repository || true
          mkdir -p /tmp/renovate/cache/renovate/repository
      - name: Get last Renovate run id
        if: ${{ !(github.event.inputs.cache == 'disabled') }}
        run: >-
          run_id=$(gh run list --workflow="${{ github.workflow }}" --branch="${{
          github.ref_name }}" --status=success --limit=1 --json databaseId --jq
          '.[0].databaseId  // empty')

          echo "runId=$run_id" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: step_10
      - name: Download Renovate repository cache
        if: ${{ !(github.event.inputs.cache == 'disabled') &&
          (steps.step_10.outputs.runId != '') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: renovate-repository-cache
          path: /tmp/renovate/cache/renovate/repository
          run-id: ${{ steps.step_10.outputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Fix-up Renovate cache permissions
        if: ${{ !(github.event.inputs.cache == 'disabled') }}
        run: sudo chown -R 12021:0 /tmp/renovate/ || true
      - name: Write Renovate entrypoint
        run: >-
          cat > /tmp/renovate-entrypoint.sh <<'EOF'

          #!/bin/bash

          set -e

          runuser -u ubuntu -- install-tool node ${{
          steps.step_7.outputs.version }}

          runuser -u ubuntu -- install-tool yarn ${{
          steps.step_6.outputs.version }}

          exec runuser -u ubuntu --preserve-environment renovate

          EOF

          chmod +x /tmp/renovate-entrypoint.sh
        shell: bash
      - name: Run Renovate
        uses: renovatebot/github-action@22e0a16091fc706b04affe6ae53d5e3358ac4023
        with:
          token: ${{ steps.step_1.outputs.token }}
          configurationFile: .github/renovate.json
          docker-user: root
          docker-cmd-file: /tmp/renovate-entrypoint.sh
        env:
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.cache }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^yarn install --immutable$","^yarn actions:build$"]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Upload Renovate repository cache
        if: ${{ !(github.event.inputs.cache == 'disabled') && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: renovate-repository-cache
          path: /tmp/renovate/cache/renovate/repository
          retention-days: 1
      - name: Remove Renovate cache
        if: ${{ !(github.event.inputs.cache == 'disabled') && success() }}
        run: gh cache delete renovate-cache-v2 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Renovate Cache
        if: ${{ !(github.event.inputs.cache == 'disabled') && success() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-v2
concurrency:
  group: renovate
permissions:
  contents: read
  actions: write
