type User {
	id: ID!
	email: String!
	lastName: String!
	profile: String
	givenName: String
}

input UserWhereUniqueInput @constraints(minFields: 1, maxFields: 1) {
	id: ID
	email: String
}

type Query {
	user(where: UserWhereUniqueInput!): User
}

input CreateUserInput {
	email: String! @validString(minLength: 5, maxLength: 128)
	username: String! @validString(minLength: 4, maxLength: 32)
	lastName: String!
	firstName: String
}

type Mutation {
	createUser(email: String! @validString(minLength: 5, maxLength: 128), lastName: String!): User
}
