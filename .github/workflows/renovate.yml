# !!! This file is auto-generated, do not edit by hand !!!
# To make changes, edit .github/workflows-src/renovate.ts and then run:
#
#   github-actions-workflow-builder --directory ".github/workflows-src"

name: Renovate
on:
  workflow_dispatch:
    inputs:
      cache:
        required: false
        default: enabled
        description: Cache mode
        type: choice
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        required: false
        default: info
        description: Log level for Renovate
        type: choice
        options:
          - debug
          - info
jobs:
  Renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create Baeta Bot Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.BAETA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BAETA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
        id: step_1
      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Get yarn info
        run: echo "version=$(yarn --version)" >> $GITHUB_OUTPUT
        id: step_6
      - name: Restore Renovate Cache
        if: ${{ !(github.event.inputs.cache == 'disabled') }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-v2
        id: step_7
      - name: Wipe Renovate Cache
        if: ${{ !(github.event.inputs.cache == 'disabled') &&
          ((github.event.inputs.cache == 'reset') &&
          (steps.step_7.outputs.cache-hit == 'true')) }}
        run: |-
          mv /tmp/renovate/cache/renovate/repository /tmp/renovate-repo-keep
          rm -rf /tmp/renovate/cache
          mkdir -p /tmp/renovate/cache/renovate
          mv /tmp/renovate-repo-keep /tmp/renovate/cache/renovate/repository
      - name: Fix-up Renovate cache permissions
        if: ${{ !(github.event.inputs.cache == 'disabled') &&
          (steps.step_7.outputs.cache-hit == 'true') }}
        run: sudo chown -R 12021:0 /tmp/renovate/ || true
      - name: Write Renovate Entrypoint
        run: >-
          cat > /tmp/renovate-entrypoint.sh <<'EOF'

          #!/bin/bash

          set -e

          runuser -u ubuntu -- install-tool node 24.14.1

          runuser -u ubuntu -- install-tool yarn ${{
          steps.step_6.outputs.version }}

          exec runuser -u ubuntu --preserve-environment renovate

          EOF

          chmod +x /tmp/renovate-entrypoint.sh
        shell: bash
      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961
        with:
          token: ${{ steps.step_1.outputs.token }}
          configurationFile: .github/renovate.json
          docker-user: root
          docker-cmd-file: /tmp/renovate-entrypoint.sh
        env:
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.cache }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^yarn install --immutable
            --immutable-cache$","^yarn actions:build$"]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Remove Renovate Cache
        if: ${{ (success() && !(github.event.inputs.cache == 'disabled')) &&
          (steps.step_7.outputs.cache-hit == 'true') }}
        run: gh cache delete renovate-cache-v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Renovate Cache
        if: ${{ success() && !(github.event.inputs.cache == 'disabled') }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-v2
concurrency:
  group: renovate
permissions:
  contents: read
  actions: write
