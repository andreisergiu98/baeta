type User {
	id: ID!
	email: String!
	lastName: String!
	profile: String
	givenName: String
	birthday: DateTime
}

input UserWhereUniqueInput @constraints(minFields: 1, maxFields: 1) {
	id: ID
	email: String
}

input CreateUserInput {
	email: String!
	lastName: String! @validString(minLength: 3, maxLength: 20)
	givenName: String @validString(minLength: 3, maxLength: 20)
	birthday: DateTime
	profile: String
}

input UpdateUserInput @constraints(minFields: 1) {
	email: String
	lastName: String @validString(minLength: 3, maxLength: 20)
	givenName: String @validString(minLength: 3, maxLength: 20)
	birthday: DateTime
	profile: String
}

type Query {
	user(where: UserWhereUniqueInput!): User
	users(where: UserWhereUniqueInput): [User!]
}

type Mutation {
	createUser(data: CreateUserInput!): User!
	updateUser(where: UserWhereUniqueInput!, data: UpdateUserInput!): User
}

type Subscription {
	userCreated: User!
	userUpdated: User!
}
