name: Security
on:
  push:
    branches:
      - next
  pull_request: null
  workflow_dispatch: null
  schedule:
    - cron: 0 3 * * *
jobs:
  supply-chain-check:
    name: Supply chain check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - run: npm install -g sfw@2.0.4
      - run: sfw yarn install --immutable
      - name: Run yarn lockfile-lint --path yarn.lock
        run: yarn lockfile-lint --path yarn.lock --type yarn --validate-integrity
          --allowed-hosts npm yarn --validate-package-names --allowed-schemes
          "npm:" "workspace:" "patch:"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
