compressionLevel: mixed

enableColors: true

enableGlobalCache: false

npmMinimalAgeGate: "7d"

npmAuthToken: "${NPM_TOKEN-}"

packageExtensions:
  "typedoc-docusaurus-theme@*":
    peerDependencies:
      "typedoc": "*"

preferInteractive: true
enableScripts: false
changesetBaseRefs: ["HEAD"]

catalogs:
  prod:
    "graphql-ws": "^6.0.8"
    "react-dom": "^19.2.4"
    "react": "^19.2.4"
  dev:
    "@types/node": "^22.19.13"
    "@types/react": "^19.2.14"
    "@types/react-dom": "^19.2.3"
    "@types/ws": "^8.18.1"
    "@graphql-codegen/cli": "^6.2.1"
    "@graphql-codegen/client-preset": "^5.2.4"
    "graphql-scalars": "^1.25.0"
    "graphql-yoga": "^5.20.0"
    "graphql": "^16.6.0"
    "typescript": "^5.9.3"
    "ws": "^8.20.0"
