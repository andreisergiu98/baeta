# !!! This file is auto-generated, do not edit by hand !!!
# To make changes, edit .github/workflows-src/renovate.ts and then run:
#
#   github-actions-workflow-builder --directory ".github/workflows-src"

name: Renovate
on:
  workflow_dispatch:
    inputs:
      cache:
        required: false
        default: enabled
        description: Enable Renovate cache
        type: choice
        options:
          - enabled
          - disabled
      logLevel:
        required: false
        default: info
        description: Log level for Renovate
        type: choice
        options:
          - debug
          - info
jobs:
  Renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          client-id: ${{ secrets.BAETA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.BAETA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: baeta
        env:
          LOG_LEVEL: debug
        id: step_1
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Get yarn cache directory
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        shell: bash
        id: step_5
      - name: Setup Yarn Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ steps.step_5.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-
      - run: yarn install --immutable
      - name: Use Renovate Cache
        if: ${{ github.event.inputs.cache != 'disabled' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/renovate/cache/renovate/repository
          key: renovate-cache-${{ github.run_id }}
          restore-keys: renovate-cache-
      - name: Cache Renovate Install
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.npm
          key: renovate-npm-cache-${{ runner.os }}
          restore-keys: renovate-npm-cache-
      - name: Run Renovate
        run: npx --yes renovate
        env:
          RENOVATE_TOKEN: ${{ steps.step_1.outputs.token }}
          RENOVATE_CONFIG_FILE: .github/renovate.json
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.cache }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^yarn install$","^yarn actions:build$"]'
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}
          NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: renovate
permissions:
  contents: read
