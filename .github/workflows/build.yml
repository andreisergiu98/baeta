          restore-keys: turbo-build-24-${{ runner.os }}-
      - run: yarn install --immutable
      - name: Get PR number
        run: |-
          PR_NUMBER=$(gh pr list \
            --head $BRANCH \
            --repo ${{ github.repository }} \
            --json number \
            --jq ".[0].number")
          echo "pr=$PR_NUMBER" >> $GITHUB_OUTPUT
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: step_8
      - name: Publish snapshot
        if: ${{ (steps.step_8.outputs.pr != '') && (steps.step_8.outputs.pr != null) &&
          startsWith(github.event.inputs.tag, 'alpha') }}
        run: >-
          yarn changeset version --snapshot ${{ steps.step_8.outputs.pr }}

          if [[ `git status --porcelain` ]]; then
            echo "Changes detected, publishing snapshot"
          else
            echo "::error::No changesets detected, skipping snapshot"
            exit 1
          fi

          yarn builder release --ci --tag=${{ github.event.inputs.tag }}
          --verbose
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
