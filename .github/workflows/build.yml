      - build-examples
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch') && (github.repository ==
      'andreisergiu98/baeta') }}
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Setup Yarn Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .yarn/cache
          key: yarn-cache-v2-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-cache-v2-${{ runner.os }}-
      - name: Setup Turbo Cache for build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/turbo
          key: turbo-build-24-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-24-${{ runner.os }}-
      - run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"
          YARN_ENABLE_HARDENED_MODE: "0"
      - name: Get PR number
        run: |-
          PR_NUMBER=$(gh pr list \
            --head $BRANCH \
            --repo ${{ github.repository }} \
            --json number \
            --jq ".[0].number")
          echo "pr=$PR_NUMBER" >> $GITHUB_OUTPUT
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: step_7
      - name: Publish snapshot
        if: ${{ (steps.step_7.outputs.pr != '') && (steps.step_7.outputs.pr != null) &&
          startsWith(github.event.inputs.tag, 'alpha') }}
        run: >-
          yarn changeset version --snapshot ${{ steps.step_7.outputs.pr }}

          if [[ `git status --porcelain` ]]; then
            echo "Changes detected, publishing snapshot"
          else
            echo "::error::No changesets detected, skipping snapshot"
            exit 1
          fi

          yarn builder release --ci --tag=${{ github.event.inputs.tag }}
          --verbose
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-snapshots
      cancel-in-progress: false
    permissions:
      id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
