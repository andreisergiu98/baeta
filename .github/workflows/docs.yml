name: Build website
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - yarn.lock
  pull_request:
    paths:
      - website/**
      - yarn.lock
  workflow_dispatch: null
jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    if: ${{ !((github.repository == 'andreisergiu98/baeta') && ((github.event_name
      == 'push') || (github.event_name == 'workflow_dispatch'))) }}
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Setup Yarn Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .yarn/cache
          key: yarn-cache-v2-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-cache-v2-${{ runner.os }}-
      - run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"
          YARN_ENABLE_HARDENED_MODE: "0"
      - run: yarn docs:build
    permissions:
      contents: read
  release:
    name: Release website
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'andreisergiu98/baeta') && ((github.event_name ==
      'push') || (github.event_name == 'workflow_dispatch')) }}
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Enable Corepack
        run: |-
          npm uninstall -g yarn || true
          corepack enable
        shell: bash
      - name: Setup Yarn Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .yarn/cache
          key: yarn-cache-v2-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-cache-v2-${{ runner.os }}-
      - run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: "false"
          YARN_ENABLE_HARDENED_MODE: "1"
      - run: yarn docs:build
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
    concurrency:
      group: publish-website
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      deployments: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
