name: Snapshot

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
        default: "alpha"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Get PR number for branch
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --repo "$REPO" \
            --json number \
            --jq '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup env
        uses: ./.github/actions/setup

      - name: Publish Snapshot
        if: steps.pr.outputs.pr_number != '' && steps.pr.outputs.pr_number != null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn changeset version --snapshot ${{ steps.pr.outputs.pr_number }}

          if [[ `git status --porcelain` ]]; then
              echo "Changes detected, publishing snapshot"
          else
              echo "::error::No changesets detected, skipping snapshot"
              exit 1
          fi

          yarn builder release --ci --tag=${{ inputs.tag }}
